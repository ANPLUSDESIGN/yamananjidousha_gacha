<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>山南自動車 大抽選会</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      background: #ffffff;
      color: #222;
    }

    body {
      min-height: 100dvh;
    }

    .screen {
      width: 100%;
      min-height: 100dvh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .screen.active {
      display: flex;
    }

    .box {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }

    /* =====================================
       最初の仮画面
       ===================================== */

    .title-small {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .title-main {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 45px;
    }

    .draw-button {
      width: 100%;
      max-width: 500px;
      min-height: 90px;
      border: none;
      border-radius: 18px;
      font-size: 28px;
      font-weight: 900;
      cursor: pointer;
      background: #111;
      color: #fff;
      box-shadow: 0 8px 0 #555;
    }

    .draw-button:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #555;
    }

    .draw-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .loading {
      margin-top: 25px;
      font-size: 17px;
      font-weight: 700;
      display: none;
    }

    .error {
      display: none;
      margin-top: 25px;
      padding: 15px;
      border-radius: 12px;
      background: #f3f3f3;
      font-size: 16px;
      line-height: 1.6;
    }


    /* =====================================
       動画
       ===================================== */

    #videoScreen {
      padding: 0;
      background: #000;
    }

    .video-wrap {
      width: 100%;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #gachaVideo {
      display: block;
      width: 100%;
      max-width: 720px;
      max-height: 100dvh;
      object-fit: contain;
      background: #000;
    }


    /* =====================================
       当選画面
       ===================================== */

    #resultScreen {
      padding-top: 25px;
      padding-bottom: 40px;
    }

    .result-title {
      font-size: 26px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .prize-image {
      display: block;
      width: 100%;
      max-width: 650px;
      height: auto;
      margin: 0 auto 25px;
      border-radius: 12px;
    }

    .staff-message {
      font-size: 21px;
      font-weight: 900;
      line-height: 1.6;
      margin: 20px 0 10px;
    }

    .staff-note {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .redeem-button {
      width: 100%;
      max-width: 520px;
      min-height: 82px;
      border: none;
      border-radius: 16px;
      background: #111;
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      cursor: pointer;
    }

    .redeem-button:disabled {
      cursor: default;
      background: #999;
    }

    .redeemed {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 22px;
      border-radius: 16px;
      background: #e5e5e5;
      color: #666;
      font-size: 27px;
      font-weight: 900;
    }

    .test-again {
      display: none;
      width: 100%;
      max-width: 420px;
      margin: 30px auto 0;
      min-height: 55px;
      border: 1px solid #bbb;
      border-radius: 12px;
      background: #fff;
      color: #555;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>


<body>

  <!-- =====================================
       最初の画面
       ===================================== -->

  <section
    id="startScreen"
    class="screen active"
  >

    <div class="box">

      <div class="title-small">
        山南自動車公式LINE お友達追加
      </div>

      <div class="title-main">
        大抽選会
      </div>

      <button
        id="drawButton"
        class="draw-button"
        type="button"
      >
        ガチャをひく
      </button>

      <div
        id="loading"
        class="loading"
      >
        抽選中です…
      </div>

      <div
        id="errorMessage"
        class="error"
      ></div>

    </div>

  </section>


  <!-- =====================================
       動画画面
       ===================================== -->

  <section
    id="videoScreen"
    class="screen"
  >

    <div class="video-wrap">

      <video
        id="gachaVideo"
        playsinline
        preload="auto"
      >
        <source
          src="y.mp4"
          type="video/mp4"
        >
      </video>

    </div>

  </section>


  <!-- =====================================
       当選結果画面
       ===================================== -->

  <section
    id="resultScreen"
    class="screen"
  >

    <div class="box">

      <div class="result-title">
        当選結果
      </div>

      <img
        id="prizeImage"
        class="prize-image"
        src=""
        alt="当選景品"
      >

      <div class="staff-message">
        この画面をスタッフに<br>
        見せてください。
      </div>

      <div class="staff-note">
        景品交換ボタンは<br>
        スタッフが操作してください。
      </div>

      <button
        id="redeemButton"
        class="redeem-button"
        type="button"
      >
        景品交換する
      </button>

      <div
        id="redeemedMessage"
        class="redeemed"
        style="display:none;"
      >
        引換済み
      </div>

      <!-- テストモードの時だけ使用 -->
      <button
        id="testAgainButton"
        class="test-again"
        type="button"
      >
        テストでもう一度引く
      </button>

    </div>

  </section>


  <script>

    // ==================================================
    // GAS Webアプリ
    // ==================================================

    const API_URL =
      'https://script.google.com/macros/s/AKfycbxE4H0xTiuuM4tgMAH32exXPDMnq3mZDA8sEYNeZ2lpvglsyGevvzxMEBr9d9LdOkhm/exec';


    // ==================================================
    // 要素
    // ==================================================

    const startScreen =
      document.getElementById('startScreen');

    const videoScreen =
      document.getElementById('videoScreen');

    const resultScreen =
      document.getElementById('resultScreen');

    const drawButton =
      document.getElementById('drawButton');

    const loading =
      document.getElementById('loading');

    const errorMessage =
      document.getElementById('errorMessage');

    const gachaVideo =
      document.getElementById('gachaVideo');

    const prizeImage =
      document.getElementById('prizeImage');

    const redeemButton =
      document.getElementById('redeemButton');

    const redeemedMessage =
      document.getElementById('redeemedMessage');

    const testAgainButton =
      document.getElementById('testAgainButton');


    let currentDrawId = '';
    let currentPrize = null;
    let currentTestMode = false;
    let redeeming = false;


    // ==================================================
    // 画面切替
    // ==================================================

    function showScreen(screen) {

      startScreen.classList.remove('active');
      videoScreen.classList.remove('active');
      resultScreen.classList.remove('active');

      screen.classList.add('active');

      window.scrollTo(0, 0);
    }


    // ==================================================
    // LINE userId
    //
    // 現在はまだLIFF未接続なので空文字。
    //
    // SERVER_DEMO_MODE = true なら
    // これでも何回でもテスト可能。
    //
    // LINE接続時にここをLIFFへ変更する。
    // ==================================================

    async function getLineUserId() {

      return '';

    }


    // ==================================================
    // GAS POST
    // ==================================================

    async function apiPost(data) {

      const response =
        await fetch(
          API_URL,
          {
            method: 'POST',
            body: JSON.stringify(data)
          }
        );

      const text =
        await response.text();

      try {

        return JSON.parse(text);

      } catch (error) {

        throw new Error(
          'サーバーから正しい応答を取得できませんでした。'
        );
      }
    }


    // ==================================================
    // GAS GET
    // ==================================================

    async function apiGet(params) {

      const url =
        new URL(API_URL);

      Object.keys(params).forEach(
        key => {
          url.searchParams.set(
            key,
            params[key]
          );
        }
      );

      const response =
        await fetch(
          url.toString()
        );

      return await response.json();
    }


    // ==================================================
    // ガチャをひく
    // ==================================================

    drawButton.addEventListener(
      'click',
      async function () {

        drawButton.disabled = true;
        loading.style.display = 'block';
        errorMessage.style.display = 'none';


        try {

          const userId =
            await getLineUserId();


          // --------------------------------------------
          // ここで抽選を確定
          // 在庫もここで1個減る
          // --------------------------------------------

          const result =
            await apiPost({
              action: 'draw',
              userId: userId
            });


          if (!result.ok) {

            showError(
              result.message ||
              '抽選できませんでした。'
            );

            return;
          }


          currentDrawId =
            result.drawId;

          currentPrize =
            result;

          currentTestMode =
            result.testMode === true;


          // --------------------------------------------
          // 抽選IDを端末に保存
          // 間違えて画面を閉じた場合の復旧用
          // --------------------------------------------

          localStorage.setItem(
            'sannan_draw_id',
            currentDrawId
          );

          localStorage.setItem(
            'sannan_test_mode',
            currentTestMode
              ? 'true'
              : 'false'
          );


          // --------------------------------------------
          // 動画へ
          // --------------------------------------------

          playGachaVideo();


        } catch (error) {

          console.error(error);

          showError(
            '通信エラーが発生しました。もう一度お試しください。'
          );
        }
      }
    );


    // ==================================================
    // エラー
    // ==================================================

    function showError(message) {

      loading.style.display = 'none';

      drawButton.disabled = false;

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        'block';
    }


    // ==================================================
    // 動画再生
    // ==================================================

    async function playGachaVideo() {

      loading.style.display = 'none';

      showScreen(videoScreen);

      gachaVideo.currentTime = 0;

      gachaVideo.controls = false;


      try {

        // まず音ありで再生を試す
        gachaVideo.muted = false;

        await gachaVideo.play();


      } catch (error) {

        // スマホ側で音あり再生が
        // ブロックされた場合は
        // 自動的にミュート再生
        try {

          gachaVideo.muted = true;

          await gachaVideo.play();

        } catch (error2) {

          // 最終手段
          gachaVideo.controls = true;

        }
      }
    }


    // ==================================================
    // 動画終了 → 当選画面
    // ==================================================

    gachaVideo.addEventListener(
      'ended',
      function () {

        showPrizeResult(
          currentPrize
        );
      }
    );


    // ==================================================
    // 景品表示
    // ==================================================

    function showPrizeResult(data) {

      if (!data) {
        return;
      }


      // y1.png ～ y7.png
      prizeImage.src =
        data.image ||
        (
          data.prizeId +
          '.png'
        );


      showScreen(
        resultScreen
      );


      // --------------------------------------------
      // 引換状態
      // --------------------------------------------

      if (
        data.redeemStatus ===
        '引換済み'
      ) {

        showRedeemed();

      } else {

        redeemButton.style.display =
          'inline-block';

        redeemedMessage.style.display =
          'none';
      }


      // --------------------------------------------
      // テストモードのみ
      // 「もう一度」
      // --------------------------------------------

      if (currentTestMode) {

        testAgainButton.style.display =
          'block';

      } else {

        testAgainButton.style.display =
          'none';
      }
    }


    // ==================================================
    // 景品交換
    // ==================================================

    redeemButton.addEventListener(
      'click',
      async function () {

        if (
          redeeming ||
          !currentDrawId
        ) {
          return;
        }


        const confirmed =
          window.confirm(
            'スタッフの方が操作していますか？\n\n景品をお客様へお渡しした後に「OK」を押してください。'
          );


        if (!confirmed) {
          return;
        }


        redeeming = true;

        redeemButton.disabled = true;

        redeemButton.textContent =
          '処理中…';


        try {

          const result =
            await apiPost({
              action: 'redeem',
              drawId: currentDrawId
            });


          if (!result.ok) {

            alert(
              result.message ||
              '引換処理に失敗しました。'
            );

            redeemButton.disabled =
              false;

            redeemButton.textContent =
              '景品交換する';

            redeeming = false;

            return;
          }


          showRedeemed();


        } catch (error) {

          console.error(error);

          alert(
            '通信エラーが発生しました。'
          );

          redeemButton.disabled =
            false;

          redeemButton.textContent =
            '景品交換する';

          redeeming = false;
        }
      }
    );


    // ==================================================
    // 引換済み表示
    // ==================================================

    function showRedeemed() {

      redeemButton.style.display =
        'none';

      redeemedMessage.style.display =
        'block';

      redeeming = false;
    }


    // ==================================================
    // テストでもう一度
    // ==================================================

    testAgainButton.addEventListener(
      'click',
      function () {

        localStorage.removeItem(
          'sannan_draw_id'
        );

        localStorage.removeItem(
          'sannan_test_mode'
        );

        location.reload();
      }
    );


    // ==================================================
    // 画面を閉じた・更新した場合の復旧
    // ==================================================

    async function restoreResult() {

      const savedDrawId =
        localStorage.getItem(
          'sannan_draw_id'
        );


      if (!savedDrawId) {
        return;
      }


      currentDrawId =
        savedDrawId;


      currentTestMode =
        localStorage.getItem(
          'sannan_test_mode'
        ) === 'true';


      try {

        const result =
          await apiGet({
            action: 'result',
            drawId: savedDrawId
          });


        if (!result.ok) {

          localStorage.removeItem(
            'sannan_draw_id'
          );

          localStorage.removeItem(
            'sannan_test_mode'
          );

          return;
        }


        currentPrize =
          result;


        showPrizeResult(
          result
        );


      } catch (error) {

        console.error(
          '結果復旧エラー',
          error
        );
      }
    }


    // ==================================================
    // 起動
    // ==================================================

    restoreResult();

  </script>

</body>
</html>g
