<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>山南自動車 抽選結果</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", "Meiryo", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body { min-height: 100dvh; overflow-x: hidden; }
    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
    }
    .screen {
      display: none;
      width: 100%;
      min-height: 100dvh;
      justify-content: center;
      align-items: flex-start;
    }
    .screen.active { display: flex; }
    .frame {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      line-height: 0;
    }
    .full-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      border: 0;
      user-select: none;
      -webkit-user-drag: none;
    }
    #accessScreen, #emptyScreen {
      align-items: center;
      padding: 28px 20px;
      text-align: center;
    }
    .messageBox {
      width: 100%;
      max-width: 520px;
      line-height: 1.65;
    }
    .messageBox h1 {
      font-size: 26px;
      font-weight: 900;
      margin: 0 0 14px;
    }
    .messageBox p {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }
    #redeemButton, #redeemed {
      position: absolute;
      left: 50%;
      bottom: 4.4%;
      transform: translateX(-50%);
      z-index: 5;
      width: 78%;
      min-height: 68px;
      border-radius: 18px;
      font-weight: 900;
      line-height: 1.2;
    }
    #redeemButton {
      border: 0;
      background: rgba(15,15,15,.94);
      color: #fff;
      font-size: clamp(19px, 3.8vw, 26px);
    }
    #redeemButton:disabled { opacity: .58; }
    #redeemed {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: rgba(230,230,230,.97);
      color: #666;
      font-size: clamp(22px, 4vw, 30px);
    }
    #alreadyText {
      position: absolute;
      left: 50%;
      bottom: 13.2%;
      transform: translateX(-50%);
      z-index: 6;
      width: 84%;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255,255,255,.97);
      color: #333;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.45;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,.15);
    }
  </style>
</head>
<body>
  <section id="accessScreen" class="screen active">
    <div class="messageBox">
      <h1>抽選結果を確認しています</h1>
      <p>そのままお待ちください。</p>
    </div>
  </section>

  <section id="emptyScreen" class="screen">
    <div class="messageBox">
      <h1>抽選結果がありません</h1>
      <p>このLINEアカウントの抽選履歴はありません。通常のガチャQRから抽選してください。</p>
    </div>
  </section>

  <section id="resultScreen" class="screen">
    <div class="frame">
      <img id="prizeImage" class="full-image" src="" width="720" height="1080" alt="当選景品">
      <div id="alreadyText">このLINEアカウントは抽選済みです。</div>
      <button id="redeemButton" type="button">景品交換する</button>
      <div id="redeemed">引換済み</div>
    </div>
  </section>

<script>
  const GACHA_API_URL = 'https://script.google.com/macros/s/AKfycbxE4H0xTiuuM4tgMAH32exXPDMnq3mZDA8sEYNeZ2lpvglsyGevvzxMEBr9d9LdOkhm/exec';
  const LIFF_ID = '2011684043-GnjrPlL2';
  const ASSET_VER = 'result1';

  const PRIZE_IMAGES = {
    y1: 'y1.png',
    y2: 'y2.png',
    y3: 'y3.png',
    y4: 'y4.png',
    y5: 'y5.png',
    y6: 'y6.png',
    y7: 'y7.png'
  };

  const accessScreen = document.getElementById('accessScreen');
  const emptyScreen = document.getElementById('emptyScreen');
  const resultScreen = document.getElementById('resultScreen');
  const prizeImage = document.getElementById('prizeImage');
  const redeemButton = document.getElementById('redeemButton');
  const redeemed = document.getElementById('redeemed');

  let lineUserId = '';
  let currentDrawId = '';
  let redeemBusy = false;

  function showOnly(screen) {
    accessScreen.classList.remove('active');
    emptyScreen.classList.remove('active');
    resultScreen.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo(0, 0);
  }

  function requestApi(action, params = {}) {
    return new Promise((resolve, reject) => {
      const callbackName = 'yamananResultCallback_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      let finished = false;

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error('通信タイムアウト'));
      }, 40000);

      function cleanup() {
        if (finished) return;
        finished = true;
        clearTimeout(timer);
        try { delete window[callbackName]; }
        catch (error) { window[callbackName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[callbackName] = function(data) {
        cleanup();
        resolve(data);
      };

      script.onerror = function() {
        cleanup();
        reject(new Error('通信エラー'));
      };

      let url = GACHA_API_URL +
        '?action=' + encodeURIComponent(action) +
        '&callback=' + encodeURIComponent(callbackName) +
        '&_=' + Date.now();

      Object.keys(params).forEach(key => {
        url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
      });

      script.src = url;
      document.head.appendChild(script);
    });
  }

  function showPrizeResult(data) {
    const prizeId = String(data && data.result ? data.result : '');
    if (!data || !data.drawId || !PRIZE_IMAGES[prizeId]) {
      throw new Error('抽選結果を確認できませんでした');
    }

    currentDrawId = String(data.drawId);
    prizeImage.src = PRIZE_IMAGES[prizeId] + '?v=' + ASSET_VER;

    if (data.redeemed === true || data.redeemStatus === '引換済み') {
      redeemButton.style.display = 'none';
      redeemed.style.display = 'flex';
    } else {
      redeemed.style.display = 'none';
      redeemButton.style.display = 'block';
      redeemButton.disabled = false;
      redeemButton.textContent = '景品交換する';
    }

    showOnly(resultScreen);
  }

  redeemButton.addEventListener('click', async () => {
    if (redeemBusy || !lineUserId || !currentDrawId) return;

    redeemBusy = true;
    redeemButton.disabled = true;
    redeemButton.textContent = '交換処理中…';

    try {
      const data = await requestApi('redeem', {
        drawId: currentDrawId,
        userId: lineUserId
      });

      if (!data || data.success !== true) {
        throw new Error(data && data.message ? data.message : '景品交換できませんでした');
      }

      redeemButton.style.display = 'none';
      redeemed.style.display = 'flex';

    } catch (error) {
      console.error(error);
      redeemButton.disabled = false;
      redeemButton.textContent = '景品交換する';
      alert(error && error.message ? error.message : '景品交換できませんでした');
    } finally {
      redeemBusy = false;
    }
  });

  (async () => {
    try {
      if (typeof liff === 'undefined') {
        throw new Error('LINE認証を読み込めませんでした');
      }

      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      lineUserId = String(profile && profile.userId ? profile.userId : '').trim();

      if (!/^U[0-9A-Za-z_-]{20,80}$/.test(lineUserId)) {
        throw new Error('LINEユーザーを確認できませんでした');
      }

      const data = await requestApi('result', { userId: lineUserId });

      if (!data || data.success !== true) {
        throw new Error(data && data.message ? data.message : '抽選結果を確認できませんでした');
      }

      if (data.found !== true) {
        showOnly(emptyScreen);
        return;
      }

      showPrizeResult(data);

    } catch (error) {
      console.error(error);
      accessScreen.querySelector('h1').textContent = '確認できませんでした';
      accessScreen.querySelector('p').textContent = error && error.message ? error.message : 'もう一度QRから開いてください。';
    }
  })();
</script>
</body>
</html>
