<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>山南自動車 大抽選会</title>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
      color: #222;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    button {
      font-family: inherit;
    }


    /* ========================================
       共通
    ======================================== */

    .screen {
      display: none;
      width: 100%;
      min-height: 100dvh;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .screen.active {
      display: flex;
    }

    .box {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
    }


    /* ========================================
       最初の画面
    ======================================== */

    .start-subtitle {
      margin-bottom: 10px;

      font-size: 20px;
      font-weight: 800;
      line-height: 1.5;
    }

    .start-title {
      margin-bottom: 45px;

      font-size: 40px;
      font-weight: 900;
      line-height: 1.25;
    }

    .draw-button {
      display: block;

      width: 100%;
      max-width: 500px;
      min-height: 90px;

      margin: 0 auto;

      border: 0;
      border-radius: 18px;

      background: #111;
      color: #fff;

      font-size: 28px;
      font-weight: 900;

      cursor: pointer;

      box-shadow: 0 8px 0 #555;
    }

    .draw-button:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #555;
    }

    .draw-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .loading {
      display: none;

      margin-top: 25px;

      font-size: 18px;
      font-weight: 800;
    }

    .error-message {
      display: none;

      margin-top: 25px;
      padding: 16px;

      border-radius: 12px;

      background: #f1f1f1;

      font-size: 16px;
      font-weight: 700;
      line-height: 1.7;
    }


    /* ========================================
       動画
    ======================================== */

    #videoScreen {
      padding: 0;
      background: #000;
    }

    .video-wrap {
      position: relative;
      display: flex;

      width: 100%;
      min-height: 100dvh;

      align-items: center;
      justify-content: center;

      background: #000;
    }

    #gachaVideo {
      display: block;

      width: 100%;
      max-width: 720px;
      max-height: 100dvh;

      object-fit: contain;

      background: #000;
    }

    .video-status {
      display: none;
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);

      width: calc(100% - 40px);
      max-width: 520px;
      padding: 14px 18px;

      border-radius: 14px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;

      font-size: 18px;
      font-weight: 900;
      text-align: center;
    }


    /* ========================================
       当選結果
    ======================================== */

    #resultScreen {
      padding: 0;
      align-items: flex-start;
    }

    .result-title {
      margin: 8px 0 6px;

      font-size: 22px;
      font-weight: 900;
    }

    .prize-wrap {
      position: relative;

      width: 100%;
      max-width: 720px;

      margin: 0 auto;
    }

    .prize-image {
      display: block;

      width: 100%;
      height: auto;

      margin: 0;

      object-fit: contain;
    }

    .prize-wrap .redeem-button,
    .prize-wrap .redeemed-message {
      position: absolute;

      left: 50%;
      bottom: 4.5%;

      width: 76%;
      max-width: 540px;

      transform: translateX(-50%);
      z-index: 2;
    }


    /* ========================================
       景品交換
    ======================================== */

    .redeem-button {
      display: block;

      width: 100%;
      max-width: 500px;
      min-height: 82px;

      margin: 0 auto;

      border: 0;
      border-radius: 16px;

      background: #111;
      color: #fff;

      font-size: 24px;
      font-weight: 900;

      cursor: pointer;
    }

    .redeem-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .redeemed-message {
      display: none;

      width: 100%;
      max-width: 500px;

      margin: 0 auto;
      padding: 24px;

      border-radius: 16px;

      background: #e5e5e5;
      color: #666;

      font-size: 28px;
      font-weight: 900;
    }

    #resultScreen .box {
      max-width: 720px;
      width: 100%;
      padding: 0;
    }

    @media (max-width: 480px) {
      .result-title {
        font-size: 20px;
      }

      .redeem-button {
        min-height: 62px;
        font-size: 20px;
      }

      .redeemed-message {
        padding: 18px;
        font-size: 22px;
      }
    }
  </style>
</head>


<body>

  <!-- ========================================
       最初の画面
  ======================================== -->

  <section
    id="startScreen"
    class="screen active"
  >

    <div class="box">

      <div class="start-subtitle">
        山南自動車公式LINE<br>
        お友達追加
      </div>

      <div class="start-title">
        大抽選会
      </div>

      <button
        id="drawButton"
        class="draw-button"
        type="button"
      >
        ガチャをひく
      </button>

      <div
        id="loading"
        class="loading"
      >
        抽選中です…
      </div>

      <div
        id="errorMessage"
        class="error-message"
      ></div>

    </div>

  </section>


  <!-- ========================================
       動画
  ======================================== -->

  <section
    id="videoScreen"
    class="screen"
  >

    <div class="video-wrap">

      <video
        id="gachaVideo"
        playsinline
        preload="metadata"
      >

        <source
          src="y.mp4"
          type="video/mp4"
        >

      </video>

      <div
        id="videoStatus"
        class="video-status"
      >
        抽選結果を確認中です…
      </div>

    </div>

  </section>


  <!-- ========================================
       当選結果
  ======================================== -->

  <section
    id="resultScreen"
    class="screen"
  >

    <div class="box">

      <div class="prize-wrap">

        <img
          id="prizeImage"
          class="prize-image"
          src=""
          alt="当選景品"
        >

        <button
          id="redeemButton"
          class="redeem-button"
          type="button"
        >
          景品交換する
        </button>

        <div
          id="redeemedMessage"
          class="redeemed-message"
        >
          引換済み
        </div>

      </div>

    </div>

  </section>


  <script>

    // ==================================================
    // GAS WebアプリURL
    // ==================================================

    const API_URL =
      'https://script.google.com/macros/s/AKfycbxE4H0xTiuuM4tgMAH32exXPDMnq3mZDA8sEYNeZ2lpvglsyGevvzxMEBr9d9LdOkhm/exec';


    // ==================================================
    // 山南自動車 LIFF ID
    // ==================================================

    const LIFF_ID =
      '2011684043-GnjrPlL2';


    // ==================================================
    // HTML
    // ==================================================

    const startScreen =
      document.getElementById(
        'startScreen'
      );

    const videoScreen =
      document.getElementById(
        'videoScreen'
      );

    const resultScreen =
      document.getElementById(
        'resultScreen'
      );

    const drawButton =
      document.getElementById(
        'drawButton'
      );

    const loading =
      document.getElementById(
        'loading'
      );

    const errorMessage =
      document.getElementById(
        'errorMessage'
      );

    const gachaVideo =
      document.getElementById(
        'gachaVideo'
      );

    const videoStatus =
      document.getElementById(
        'videoStatus'
      );

    const prizeImage =
      document.getElementById(
        'prizeImage'
      );

    const redeemButton =
      document.getElementById(
        'redeemButton'
      );

    const redeemedMessage =
      document.getElementById(
        'redeemedMessage'
      );


    // ==================================================
    // 現在の状態
    // ==================================================

    let currentDrawId = '';

    let currentPrize = null;

    let currentDemoMode = false;

    let redeeming = false;

    let redeemCheckOnly = false;

    let liffInitialized = false;

    let cachedUserId = '';

    let lineUserPromise = null;

    let videoFinished = false;


    // ==================================================
    // 画面切替
    // ==================================================

    function showScreen(
      screen
    ) {

      startScreen
        .classList
        .remove('active');

      videoScreen
        .classList
        .remove('active');

      resultScreen
        .classList
        .remove('active');


      screen
        .classList
        .add('active');


      window.scrollTo(
        0,
        0
      );
    }


    // ==================================================
    // GAS GET
    // ==================================================

    async function apiGet(
      params
    ) {

      const url =
        new URL(
          API_URL
        );


      Object.keys(
        params
      ).forEach(
        key => {

          url
            .searchParams
            .set(
              key,
              params[key]
            );
        }
      );


      const response =
        await fetch(
          url.toString(),
          {
            cache:
              'no-store'
          }
        );


      return await response.json();
    }


    // ==================================================
    // GAS POST
    // ==================================================

    async function apiPost(
      data
    ) {

      const response =
        await fetch(
          API_URL,
          {
            method:
              'POST',

            body:
              JSON.stringify(
                data
              )
          }
        );


      const text =
        await response.text();


      try {

        return JSON.parse(
          text
        );


      } catch (error) {

        throw new Error(
          'サーバーから正常な応答を取得できませんでした。'
        );
      }
    }


    // ==================================================
    // LINE userId取得
    //
    // テスト・本番どちらも
    // LIFF必須
    // LINE userId必須
    // ==================================================

    async function getLineUserId() {

      // ------------------------------------------
      // LIFF ID確認
      // ------------------------------------------

      if (
        !LIFF_ID
      ) {

        throw new Error(
          'LINE連携が設定されていません。'
        );
      }


      // ------------------------------------------
      // LIFF初期化
      // ------------------------------------------

      if (
        !liffInitialized
      ) {

        await liff.init({
          liffId:
            LIFF_ID
        });

        liffInitialized =
          true;
      }


      // ------------------------------------------
      // LINEログイン
      // ------------------------------------------

      if (
        !liff.isLoggedIn()
      ) {

        liff.login();

        return '';
      }


      // ------------------------------------------
      // LINEプロフィール取得
      // ------------------------------------------

      const profile =
        await liff.getProfile();


      if (
        !profile ||
        !profile.userId
      ) {

        throw new Error(
          'LINE認証を確認できませんでした。'
        );
      }


      return String(
        profile.userId
      );
    }


    // ==================================================
    // LINE認証を先に準備しておく
    // ==================================================

    async function prepareLineUserId() {

      if (
        cachedUserId
      ) {

        return cachedUserId;
      }


      if (
        !lineUserPromise
      ) {

        lineUserPromise =
          getLineUserId()
            .then(
              userId => {

                if (
                  userId
                ) {

                  cachedUserId =
                    userId;
                }

                return userId;
              }
            )
            .catch(
              error => {

                lineUserPromise =
                  null;

                throw error;
              }
            );
      }


      return await lineUserPromise;
    }


    // ==================================================
    // 待機
    // ==================================================

    function wait(
      ms
    ) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            ms
          )
      );
    }


    // ==================================================
    // 景品引換状態を確認
    // ==================================================

    async function checkRedeemStatus() {

      const result =
        await Promise.race([

          apiGet({

            action:
              'result',

            drawId:
              currentDrawId

          }),

          wait(
            7000
          ).then(
            () => {

              throw new Error(
                'timeout'
              );
            }
          )

        ]);


      if (
        result &&
        result.ok &&
        result.redeemStatus ===
        '引換済み'
      ) {

        showRedeemed();

        return true;
      }


      return false;
    }


    // ==================================================
    // ガチャボタン
    // ==================================================

    drawButton
      .addEventListener(
        'click',
        async function () {


          // --------------------------------------
          // この端末ですでに抽選済みなら
          // GASへ再抽選POSTを送らず結果を復元
          // --------------------------------------

          const savedDrawId =
            localStorage.getItem(
              'yamanan_draw_id'
            );


          if (
            savedDrawId
          ) {

            drawButton.disabled =
              true;

            drawButton.textContent =
              '抽選済み';

            loading.textContent =
              '当選結果を確認しています…';

            loading.style.display =
              'block';

            errorMessage.style.display =
              'none';


            currentDrawId =
              savedDrawId;


            if (
              currentPrize
            ) {

              showPrizeResult(
                currentPrize
              );

              return;
            }


            await restoreResult();

            return;
          }


          drawButton.disabled =
            true;

          loading.style.display =
            'none';

          errorMessage.style.display =
            'none';


          try {

            // --------------------------------------
            // 起動時から準備しているLINE userIdを使用
            // --------------------------------------

            const userId =
              await prepareLineUserId();


            if (
              !userId
            ) {

              drawButton.disabled =
                false;

              return;
            }


            // --------------------------------------
            // ボタンを押したら先に動画開始
            // GAS抽選は動画と同時進行
            // --------------------------------------

            currentPrize =
              null;

            videoFinished =
              false;

            videoStatus.style.display =
              'none';


            playGachaVideo();


            const result =
              await apiPost({

                action:
                  'draw',

                userId:
                  userId

              });


            if (
              !result.ok
            ) {

              gachaVideo.pause();

              videoStatus.style.display =
                'none';

              showScreen(
                startScreen
              );

              showError(
                result.message ||
                result.error ||
                '抽選できませんでした。'
              );

              return;
            }


            currentDrawId =
              result.drawId;

            currentPrize =
              result;

            currentDemoMode =
              result.testMode ===
              true;


            localStorage.setItem(
              'yamanan_draw_id',
              currentDrawId
            );

            localStorage.setItem(
              'yamanan_demo_mode',
              currentDemoMode
                ? 'true'
                : 'false'
            );


            videoStatus.style.display =
              'none';


            // 動画が先に終わっていた場合だけ
            // ここで結果画面へ
            if (
              videoFinished
            ) {

              showPrizeResult(
                currentPrize
              );
            }


          } catch (error) {

            console.error(
              error
            );


            gachaVideo.pause();

            videoStatus.style.display =
              'none';

            showScreen(
              startScreen
            );


            showError(
              error.message ||
              '通信エラーが発生しました。'
            );
          }
        }
      );


    // ==================================================
    // エラー
    // ==================================================

    function showError(
      message
    ) {

      loading.style.display =
        'none';

      drawButton.disabled =
        false;

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        'block';
    }


    // ==================================================
    // 動画再生
    // ==================================================

    async function playGachaVideo() {

      loading.style.display =
        'none';


      showScreen(
        videoScreen
      );


      gachaVideo.currentTime =
        0;

      gachaVideo.controls =
        false;


      try {

        // --------------------------------------
        // 音あり再生
        // --------------------------------------

        gachaVideo.muted =
          false;

        await gachaVideo.play();


      } catch (error) {

        // --------------------------------------
        // 自動再生制限時
        // --------------------------------------

        try {

          gachaVideo.muted =
            true;

          await gachaVideo.play();


        } catch (error2) {

          gachaVideo.controls =
            true;
        }
      }
    }


    // ==================================================
    // 動画終了
    // ==================================================

    gachaVideo
      .addEventListener(
        'ended',
        function () {

          videoFinished =
            true;


          if (
            currentPrize
          ) {

            showPrizeResult(
              currentPrize
            );


          } else {

            videoStatus.style.display =
              'block';
          }
        }
      );


    // ==================================================
    // 景品表示
    // ==================================================

    function showPrizeResult(
      data
    ) {

      if (
        !data
      ) {

        return;
      }


      // y1.png ～ y7.png
      prizeImage.src =
        data.image ||
        (
          data.prizeId +
          '.png'
        );


      videoStatus.style.display =
        'none';

      showScreen(
        resultScreen
      );


      // ------------------------------------------
      // 引換済みの場合
      // ------------------------------------------

      if (
        data.redeemStatus ===
        '引換済み'
      ) {

        showRedeemed();


      } else {

        redeemButton.style.display =
          'block';

        redeemButton.disabled =
          false;

        redeemButton.textContent =
          '景品交換する';

        redeemedMessage.style.display =
          'none';
      }
    }


    // ==================================================
    // 景品交換
    // ==================================================

    redeemButton
      .addEventListener(
        'click',
        async function () {


          if (
            redeeming ||
            !currentDrawId
          ) {

            return;
          }


          // --------------------------------------
          // 前回の通信が長引いた場合は
          // 二重POSTせず引換状態だけ確認
          // --------------------------------------

          if (
            redeemCheckOnly
          ) {

            redeeming =
              true;

            redeemButton.disabled =
              true;

            redeemButton.textContent =
              '確認中…';


            try {

              const redeemed =
                await checkRedeemStatus();


              if (
                !redeemed
              ) {

                alert(
                  'まだ引換完了を確認できません。通信状況を確認して、もう一度「引換状況を再確認」を押してください。'
                );

                redeemButton.disabled =
                  false;

                redeemButton.textContent =
                  '引換状況を再確認';
              }


            } catch (error) {

              console.error(
                error
              );

              alert(
                '引換状況の確認に時間がかかっています。もう一度お試しください。'
              );

              redeemButton.disabled =
                false;

              redeemButton.textContent =
                '引換状況を再確認';
            }


            redeeming =
              false;

            return;
          }


          const confirmed =
            window.confirm(
              'スタッフの方が操作していますか？\n\n景品をお客様へお渡しした後に「OK」を押してください。'
            );


          if (
            !confirmed
          ) {

            return;
          }


          redeeming =
            true;

          redeemButton.disabled =
            true;

          redeemButton.textContent =
            '処理中…';


          try {

            // POSTは送信したまま、
            // 9秒を超えたら結果確認へ切り替える
            const redeemPost =
              apiPost({

                action:
                  'redeem',

                drawId:
                  currentDrawId

              });


            const firstResult =
              await Promise.race([

                redeemPost
                  .then(
                    result => ({
                      type:
                        'result',

                      result:
                        result
                    })
                  )
                  .catch(
                    error => ({
                      type:
                        'error',

                      error:
                        error
                    })
                  ),

                wait(
                  9000
                ).then(
                  () => ({
                    type:
                      'timeout'
                  })
                )

              ]);


            if (
              firstResult.type ===
              'result'
            ) {

              const result =
                firstResult.result;


              if (
                result.ok
              ) {

                showRedeemed();

                return;
              }


              // GAS側で既に引換済みになっている可能性も確認
              const redeemed =
                await checkRedeemStatus()
                  .catch(
                    () => false
                  );


              if (
                redeemed
              ) {

                return;
              }


              alert(
                result.message ||
                result.error ||
                '引換処理に失敗しました。'
              );

              redeemButton.disabled =
                false;

              redeemButton.textContent =
                '景品交換する';

              redeeming =
                false;

              return;
            }


            if (
              firstResult.type ===
              'error'
            ) {

              throw firstResult.error;
            }


            // --------------------------------------
            // 9秒以上かかった場合
            // POSTを重複送信せず、結果だけ確認
            // --------------------------------------

            redeemButton.textContent =
              '確認中…';


            const redeemed =
              await checkRedeemStatus()
                .catch(
                  () => false
                );


            if (
              redeemed
            ) {

              return;
            }


            redeemCheckOnly =
              true;

            redeemButton.disabled =
              false;

            redeemButton.textContent =
              '引換状況を再確認';

            redeeming =
              false;


            alert(
              '通信に時間がかかっています。引換処理は送信済みです。少し待ってから「引換状況を再確認」を押してください。'
            );


          } catch (error) {

            console.error(
              error
            );


            // 通信エラーでも、サーバー側で完了している可能性を確認
            const redeemed =
              await checkRedeemStatus()
                .catch(
                  () => false
                );


            if (
              redeemed
            ) {

              return;
            }


            redeemCheckOnly =
              true;

            alert(
              '通信に時間がかかっています。二重処理を防ぐため、次は「引換状況を再確認」を押してください。'
            );


            redeemButton.disabled =
              false;

            redeemButton.textContent =
              '引換状況を再確認';

            redeeming =
              false;
          }
        }
      );


    // ==================================================
    // 引換済み表示
    // ==================================================

    function showRedeemed() {

      redeemButton.style.display =
        'none';

      redeemedMessage.style.display =
        'block';

      redeeming =
        false;

      redeemCheckOnly =
        false;
    }


    // ==================================================
    // 当選結果復旧
    //
    // ・誤って閉じた
    // ・戻る
    // ・再読み込み
    //
    // の場合に当選結果を復元
    // ==================================================

    async function restoreResult() {

      const savedDrawId =
        localStorage.getItem(
          'yamanan_draw_id'
        );


      if (
        !savedDrawId
      ) {

        return;
      }


      currentDrawId =
        savedDrawId;


      try {

        const result =
          await apiGet({

            action:
              'result',

            drawId:
              savedDrawId

          });


        // --------------------------------------
        // リセット後など
        // 抽選IDが存在しない場合
        // --------------------------------------

        if (
          !result.ok
        ) {

          localStorage.removeItem(
            'yamanan_draw_id'
          );

          localStorage.removeItem(
            'yamanan_demo_mode'
          );

          currentDrawId =
            '';

          currentPrize =
            null;

          loading.style.display =
            'none';

          drawButton.disabled =
            false;

          drawButton.textContent =
            'ガチャをひく';

          prepareLineUserId()
            .catch(
              error =>
                console.error(
                  'LINE事前認証エラー',
                  error
                )
            );

          return;
        }


        currentPrize =
          result;

        currentDemoMode =
          result.testMode ===
          true;


        localStorage.setItem(
          'yamanan_demo_mode',
          currentDemoMode
            ? 'true'
            : 'false'
        );


        loading.style.display =
          'none';

        showPrizeResult(
          result
        );


      } catch (error) {

        console.error(
          '結果復旧エラー',
          error
        );

        if (
          localStorage.getItem(
            'yamanan_draw_id'
          )
        ) {

          drawButton.disabled =
            true;

          drawButton.textContent =
            '抽選済み';

          loading.style.display =
            'none';
        }
      }
    }


    // ==================================================
    // 起動
    // ==================================================

    async function startApp() {

      const savedDrawId =
        localStorage.getItem(
          'yamanan_draw_id'
        );


      if (
        savedDrawId
      ) {

        // 起動時の復旧確認は画面に出さず裏で行う。
        // テストリセット後など、保存IDがサーバーに無ければ
        // restoreResult() 側で自動的にIDを削除して通常画面へ戻す。
        drawButton.disabled =
          true;

        loading.style.display =
          'none';

        await restoreResult();


      } else {

        // ガチャを押す前にLIFF認証を準備
        // クリック後の待ち時間を減らす
        prepareLineUserId()
          .catch(
            error =>
              console.error(
                'LINE事前認証エラー',
                error
              )
          );
      }
    }


    startApp();

  </script>

</body>
