<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>山南自動車 大抽選会</title>
  <link rel="preload" as="image" href="yt.png">
  <script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;min-height:100%;background:#fff;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic","Meiryo",sans-serif;-webkit-text-size-adjust:100%}
    body{overflow-x:hidden;overscroll-behavior-y:none}
    button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-appearance:none;appearance:none}
    .screen{display:none;width:100%}
    .screen.active{display:flex;justify-content:center;align-items:flex-start}
    .frame{position:relative;width:100%;max-width:720px;margin:0 auto;line-height:0}
    .full-image,#gachaVideo{display:block;width:100%;height:auto;margin:0;border:0}
    .full-image{user-select:none;-webkit-user-drag:none}

    #startScreen{background:#fff}
    #topImage{pointer-events:none}
    #drawButton{position:absolute;left:50%;bottom:5.8%;transform:translateX(-50%);z-index:5;width:78%;min-height:70px;padding:12px 20px;border:4px solid #ffe500;border-radius:999px;background:linear-gradient(#0aa04b,#046632);color:#fff;font-size:clamp(22px,4.4vw,32px);font-weight:900;line-height:1.1;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:0 7px 0 #034520,0 10px 20px rgba(0,0,0,.18);cursor:pointer}
    #drawButton:active:not(:disabled){transform:translate(-50%,4px);box-shadow:0 3px 0 #034520,0 6px 14px rgba(0,0,0,.14)}
    #drawButton:disabled{opacity:.62;cursor:default}
    #startMessage{display:none;position:absolute;left:50%;bottom:14.7%;transform:translateX(-50%);z-index:6;width:84%;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.96);color:#14502d;font-size:clamp(12px,2.5vw,16px);font-weight:800;line-height:1.45;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.12)}
    #startMessage.error{color:#a51e2c}

    #videoScreen{background:#000}
    #gachaVideo{background:#000;object-fit:contain}
    #videoStatus{display:none;position:absolute;left:50%;bottom:5%;transform:translateX(-50%);z-index:6;width:82%;padding:13px 16px;border-radius:14px;background:rgba(0,0,0,.78);color:#fff;font-size:16px;font-weight:900;line-height:1.45;text-align:center}
    #videoTap{display:none;position:absolute;inset:0;z-index:7;align-items:center;justify-content:center;background:rgba(0,0,0,.42)}
    #videoTap button{width:80%;min-height:72px;border:3px solid #fff;border-radius:999px;background:#08753c;color:#fff;font-size:22px;font-weight:900}

    #resultScreen{background:#fff}
    #redeemButton,#redeemed{position:absolute;left:50%;bottom:4.4%;transform:translateX(-50%);z-index:5;width:78%;min-height:68px;border-radius:18px;font-weight:900;line-height:1.2}
    #redeemButton{border:0;background:rgba(15,15,15,.94);color:#fff;font-size:clamp(19px,3.8vw,26px);cursor:pointer}
    #redeemButton:disabled{opacity:.6;cursor:default}
    #redeemed{display:none;align-items:center;justify-content:center;padding:12px;background:rgba(230,230,230,.97);color:#666;font-size:clamp(22px,4vw,30px)}
    #resultToast{display:none;position:absolute;left:50%;bottom:13.2%;transform:translateX(-50%);z-index:6;width:84%;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.97);color:#333;font-size:14px;font-weight:800;line-height:1.45;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.15)}

    @media(max-width:420px){#drawButton{min-height:64px}#redeemButton,#redeemed{min-height:62px}}
  </style>
</head>
<body>
  <section id="startScreen" class="screen active">
    <div class="frame">
      <img id="topImage" class="full-image" src="yt.png" width="720" height="1080" alt="山南自動車 大抽選会">
      <div id="startMessage" role="status" aria-live="polite"></div>
      <button id="drawButton" type="button" disabled>LINE認証を確認しています…</button>
    </div>
  </section>

  <section id="videoScreen" class="screen">
    <div class="frame">
      <video id="gachaVideo" playsinline webkit-playsinline preload="metadata">
        <source src="y.mp4" type="video/mp4">
      </video>
      <div id="videoStatus" role="status">当選結果を確認しています…</div>
      <div id="videoTap"><button id="videoTapButton" type="button">タップして抽選スタート</button></div>
    </div>
  </section>

  <section id="resultScreen" class="screen">
    <div class="frame">
      <img id="prizeImage" class="full-image" src="" width="720" height="1080" alt="当選景品">
      <div id="resultToast" role="status" aria-live="polite"></div>
      <button id="redeemButton" type="button">景品交換する</button>
      <div id="redeemed">引換済み</div>
    </div>
  </section>

  <script>
    const API_URL='https://script.google.com/macros/s/AKfycbxE4H0xTiuuM4tgMAH32exXPDMnq3mZDA8sEYNeZ2lpvglsyGevvzxMEBr9d9LdOkhm/exec';
    const LIFF_ID='2011684043-GnjrPlL2';
    const STORE='yamanan_gacha_v3';

    const $=id=>document.getElementById(id);
    const startScreen=$('startScreen'),videoScreen=$('videoScreen'),resultScreen=$('resultScreen');
    const drawButton=$('drawButton'),startMessage=$('startMessage');
    const gachaVideo=$('gachaVideo'),videoStatus=$('videoStatus'),videoTap=$('videoTap'),videoTapButton=$('videoTapButton');
    const prizeImage=$('prizeImage'),redeemButton=$('redeemButton'),redeemed=$('redeemed'),resultToast=$('resultToast');

    let authPromise=null,auth=null,current=null,drawBusy=false,redeemBusy=false,videoEnded=false,drawPromise=null,authReady=false;

    function show(screen){startScreen.classList.remove('active');videoScreen.classList.remove('active');resultScreen.classList.remove('active');screen.classList.add('active');scrollTo(0,0)}
    function startMsg(text,error=false){startMessage.textContent=text||'';startMessage.classList.toggle('error',error);startMessage.style.display=text?'block':'none'}
    function toast(text){resultToast.textContent=text||'';resultToast.style.display=text?'block':'none'}
    function loadStore(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}
    function saveStore(data){try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){}}
    function clearStore(){try{localStorage.removeItem(STORE)}catch(e){}}

    async function post(data,timeout=16000){
      const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);
      try{
        const r=await fetch(API_URL,{method:'POST',cache:'no-store',body:JSON.stringify(data),signal:c.signal});
        const text=await r.text();
        try{return JSON.parse(text)}catch(e){throw new Error('サーバー応答を確認できませんでした。')}
      }finally{clearTimeout(t)}
    }

    async function prepareAuth(){
      if(auth)return auth;
      if(authPromise)return authPromise;
      authPromise=(async()=>{
        if(!window.liff)throw new Error('LINEの読み込みに失敗しました。もう一度開いてください。');
        await liff.init({liffId:LIFF_ID});
        if(!liff.isLoggedIn()){
          liff.login({redirectUri:location.href});
          return null;
        }
        const idToken=typeof liff.getIDToken==='function'?String(liff.getIDToken()||''):'';
        const accessToken=typeof liff.getAccessToken==='function'?String(liff.getAccessToken()||''):'';
        if(!idToken&&!accessToken)throw new Error('LINE認証情報を取得できませんでした。LINEからもう一度開いてください。');
        auth={idToken,accessToken};
        return auth;
      })();
      try{return await authPromise}catch(e){authPromise=null;throw e}
    }

    function authPayload(base,a){return Object.assign(base,{idToken:a?.idToken||'',accessToken:a?.accessToken||''})}

    async function playVideo(){
      videoEnded=false;videoStatus.style.display='none';videoTap.style.display='none';show(videoScreen);
      try{gachaVideo.pause();gachaVideo.currentTime=0}catch(e){}
      gachaVideo.controls=false;gachaVideo.muted=false;
      try{await gachaVideo.play();return}
      catch(e){
        gachaVideo.muted=true;
        try{await gachaVideo.play();return}catch(e2){videoTap.style.display='flex'}
      }
    }

    videoTapButton.addEventListener('click',async()=>{
      videoTap.style.display='none';gachaVideo.muted=false;
      try{await gachaVideo.play()}catch(e){gachaVideo.muted=true;try{await gachaVideo.play()}catch(e2){videoTap.style.display='flex'}}
    });

    function setCurrent(r){
      current=r;
      saveStore({
        drawId:r.drawId,
        prizeId:r.prizeId,
        prizeName:r.prizeName||'',
        redeemStatus:r.redeemStatus||'未引換',
        sessionToken:r.sessionToken||'',
        sessionExpiresAt:r.sessionExpiresAt||0
      });
      if(r.prizeId){const img=new Image();img.src=r.prizeId+'.png'}
    }

    function showResult(r){
      if(!r||!r.prizeId)return;
      setCurrent(r);prizeImage.src=r.prizeId+'.png';toast('');show(resultScreen);
      if(r.redeemStatus==='引換済み'){redeemButton.style.display='none';redeemed.style.display='flex'}
      else{redeemed.style.display='none';redeemButton.style.display='block';redeemButton.disabled=false;redeemButton.textContent='景品交換する'}
    }

    function returnError(message){
      try{gachaVideo.pause()}catch(e){}
      show(startScreen);drawBusy=false;drawButton.disabled=false;drawButton.textContent='ガチャをひく';startMsg(message||'通信エラーが発生しました。',true)
    }

    async function restoreSaved(saved){
      if(!saved?.drawId||!saved?.sessionToken)return false;
      try{
        const r=await post({action:'result',drawId:saved.drawId,sessionToken:saved.sessionToken},9000);
        if(r?.ok){showResult(r);return true}
        if(r?.code==='SESSION_EXPIRED'||r?.code==='INVALID_SESSION')clearStore();
      }catch(e){}
      return false;
    }

    drawButton.addEventListener('click',function(){
      if(drawBusy||!authReady)return;
      drawBusy=true;drawButton.disabled=true;drawButton.textContent='抽選中…';startMsg('');

      // ユーザー操作の瞬間に動画を開始。LINE/GAS通信は動画の裏で進める。
      playVideo();

      drawPromise=(async()=>{
        try{
          const a=await prepareAuth();
          if(!a){drawBusy=false;return null}

          const saved=loadStore();
          if(saved?.drawId&&saved?.sessionToken){
            const restored=await post({action:'result',drawId:saved.drawId,sessionToken:saved.sessionToken},9000);
            if(restored?.ok){setCurrent(restored);if(videoEnded)showResult(restored);return restored}
          }

          const r=await post(authPayload({action:'draw'},a));
          if(!r?.ok)throw new Error(r?.message||'抽選できませんでした。');
          setCurrent(r);
          if(r.alreadyDrawn){
            try{gachaVideo.pause()}catch(e){}
            showResult(r);
            toast('このLINEアカウントは抽選済みです。');
            return r;
          }
          if(videoEnded)showResult(r);
          return r;
        }catch(e){returnError(e?.name==='AbortError'?'通信に時間がかかっています。もう一度お試しください。':e.message);return null}
        finally{drawBusy=false}
      })();
    });

    gachaVideo.addEventListener('ended',async()=>{
      videoEnded=true;
      if(current){showResult(current);return}
      videoStatus.style.display='block';
      try{if(drawPromise)await drawPromise}catch(e){}
      if(current)showResult(current);
    });

    redeemButton.addEventListener('click',async()=>{
      if(redeemBusy||!current?.drawId)return;
      if(!confirm('スタッフの方が操作してください。\n\n景品を確認して「OK」を押してください。'))return;
      redeemBusy=true;redeemButton.disabled=true;redeemButton.textContent='処理中…';toast('');
      try{
        let r=await post({action:'redeem',drawId:current.drawId,sessionToken:current.sessionToken||''},10000);
        if(!r?.ok&&(r?.code==='SESSION_EXPIRED'||r?.code==='INVALID_SESSION')){
          const a=await prepareAuth();
          if(a)r=await post(authPayload({action:'redeem',drawId:current.drawId},a),12000);
        }
        if(!r?.ok)throw new Error(r?.message||'景品交換を記録できませんでした。');
        current.redeemStatus='引換済み';
        if(r.sessionToken){current.sessionToken=r.sessionToken;current.sessionExpiresAt=r.sessionExpiresAt||0}
        setCurrent(current);redeemButton.style.display='none';redeemed.style.display='flex';toast('景品交換を記録しました。');
      }catch(e){redeemButton.disabled=false;redeemButton.textContent='景品交換する';toast(e?.name==='AbortError'?'通信に時間がかかっています。もう一度押してください。':e.message)}
      finally{redeemBusy=false}
    });

    // LINEの正式な認証・許可を先に完了させる。
    // TOP画像は即表示するが、認証が終わるまで抽選ボタンは押せない。
    // 未ログイン／未許可なら liff.login() からLINE公式の許可画面へ遷移する。
    // すでに許可済みのユーザーは許可画面を再表示せず、そのまま有効化される。
    async function initializeLinePermission(){
      authReady=false;
      drawButton.disabled=true;
      drawButton.textContent='LINE認証を確認しています…';
      startMsg('');

      try{
        const a=await prepareAuth();
        // liff.login() 実行時はリダイレクトに入るのでここで終了。
        if(!a)return;

        authReady=true;
        drawButton.disabled=false;
        drawButton.textContent='ガチャをひく';
      }catch(e){
        authReady=false;
        drawButton.disabled=true;
        drawButton.textContent='LINE認証エラー';
        startMsg(e?.message||'LINE認証を確認できませんでした。LINEからもう一度開いてください。',true);
      }
    }

    window.addEventListener('load',()=>{
      initializeLinePermission();
    },{once:true});

    window.addEventListener('pageshow',e=>{
      if(e.persisted){
        drawBusy=false;
        drawButton.disabled=!authReady;
        drawButton.textContent=authReady?'ガチャをひく':'LINE認証を確認しています…';
        if(!authReady)initializeLinePermission();
      }
    });
  </script>
</body>
</html>
