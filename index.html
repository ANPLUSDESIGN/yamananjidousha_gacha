<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>山南自動車 大抽選会</title>

  <link rel="preload" as="image" href="yt.png?v=smooth1">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;width:100%;min-height:100%;background:#fff;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic","Meiryo",sans-serif;-webkit-text-size-adjust:100%}
    body{min-height:100dvh;overflow-x:hidden}
    button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-appearance:none;appearance:none}
    .screen{display:none;width:100%;min-height:100dvh;justify-content:center;align-items:flex-start}
    .screen.active{display:flex}
    .frame{position:relative;width:100%;max-width:720px;margin:0 auto;line-height:0}
    .full-image,#gachaVideo{display:block;width:100%;height:auto;margin:0;border:0}
    .full-image{user-select:none;-webkit-user-drag:none}

    #startScreen{background:#fff}
    #topImage{pointer-events:none}
    #drawButton{position:absolute;left:50%;bottom:5.8%;transform:translateX(-50%);z-index:5;width:78%;min-height:70px;padding:12px 20px;border:4px solid #ffe500;border-radius:999px;background:linear-gradient(#0aa04b,#046632);color:#fff;font-size:clamp(22px,4.4vw,32px);font-weight:900;line-height:1.1;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:0 7px 0 #034520,0 10px 20px rgba(0,0,0,.18);cursor:pointer}
    #drawButton:active:not(:disabled){transform:translate(-50%,4px);box-shadow:0 3px 0 #034520,0 6px 14px rgba(0,0,0,.14)}
    #drawButton:disabled{opacity:.62;cursor:default}
    #startMessage{display:none;position:absolute;left:50%;bottom:14.7%;transform:translateX(-50%);z-index:6;width:84%;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.97);color:#14502d;font-size:clamp(12px,2.5vw,16px);font-weight:800;line-height:1.45;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.12)}
    #startMessage.error{color:#a51e2c}

    #videoScreen{background:#000;align-items:center}
    #gachaVideo{width:100%;max-height:100dvh;object-fit:contain;background:#000}
    #videoTap{display:none;position:absolute;inset:0;z-index:10;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
    #videoTap button{width:80%;max-width:500px;min-height:72px;border:3px solid #fff;border-radius:999px;background:#08753c;color:#fff;font-size:22px;font-weight:900}

    #resultScreen{background:#fff}
    #redeemButton,#redeemed{position:absolute;left:50%;bottom:4.4%;transform:translateX(-50%);z-index:5;width:78%;min-height:68px;border-radius:18px;font-weight:900;line-height:1.2}
    #redeemButton{border:0;background:rgba(15,15,15,.94);color:#fff;font-size:clamp(19px,3.8vw,26px);cursor:pointer}
    #redeemButton:disabled{opacity:.58;cursor:default}
    #redeemed{display:none;align-items:center;justify-content:center;padding:12px;background:rgba(230,230,230,.97);color:#666;font-size:clamp(22px,4vw,30px)}
    #resultToast{display:none;position:absolute;left:50%;bottom:13.2%;transform:translateX(-50%);z-index:6;width:84%;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.97);color:#333;font-size:14px;font-weight:800;line-height:1.45;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.15)}

    @media(max-width:420px){#drawButton{min-height:64px}#redeemButton,#redeemed{min-height:62px}}
  </style>
</head>
<body>

  <section id="startScreen" class="screen active">
    <div class="frame">
      <img id="topImage" class="full-image" src="yt.png?v=smooth1" width="720" height="1080" alt="山南自動車 大抽選会">
      <div id="startMessage" role="status" aria-live="polite"></div>
      <button id="drawButton" type="button" disabled>LINE認証を確認しています…</button>
    </div>
  </section>

  <section id="videoScreen" class="screen">
    <div class="frame">
      <video id="gachaVideo" src="y.mp4?v=smooth1" playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
      <div id="videoTap"><button id="videoTapButton" type="button">タップして動画を再生</button></div>
    </div>
  </section>

  <section id="resultScreen" class="screen">
    <div class="frame">
      <img id="prizeImage" class="full-image" src="" width="720" height="1080" alt="当選景品">
      <div id="resultToast" role="status" aria-live="polite"></div>
      <button id="redeemButton" type="button">景品交換する</button>
      <div id="redeemed">引換済み</div>
    </div>
  </section>

<script>
  // ==================================================
  // 山南自動車 SMOOTH
  // QR -> LIFF -> ガチャ -> 動画 -> 景品 -> 引換
  // 1LINEアカウント1回はGAS側で制御
  // ==================================================

  const GACHA_API_URL = 'https://script.google.com/macros/s/AKfycbxE4H0xTiuuM4tgMAH32exXPDMnq3mZDA8sEYNeZ2lpvglsyGevvzxMEBr9d9LdOkhm/exec';
  const LIFF_ID = '2011684043-GnjrPlL2';
  const ASSET_VER = 'smooth1';

  const $ = id => document.getElementById(id);
  const startScreen = $('startScreen');
  const videoScreen = $('videoScreen');
  const resultScreen = $('resultScreen');
  const drawButton = $('drawButton');
  const startMessage = $('startMessage');
  const movie = $('gachaVideo');
  const videoTap = $('videoTap');
  const videoTapButton = $('videoTapButton');
  const prizeImage = $('prizeImage');
  const redeemButton = $('redeemButton');
  const redeemed = $('redeemed');
  const resultToast = $('resultToast');

  let lineUserId = '';
  let currentDrawId = '';
  let drawBusy = false;
  let movieEnded = false;
  let pendingResult = null;
  let drawRequestPromise = null;

  function showOnly(screen){
    startScreen.classList.remove('active');
    videoScreen.classList.remove('active');
    resultScreen.classList.remove('active');
    screen.classList.add('active');
    window.scrollTo(0,0);
  }

  function setStartMessage(text,error=false){
    startMessage.textContent = text || '';
    startMessage.classList.toggle('error',error);
    startMessage.style.display = text ? 'block' : 'none';
  }

  function setToast(text){
    resultToast.textContent = text || '';
    resultToast.style.display = text ? 'block' : 'none';
  }

  // GAS iframe bridge。drawの結果だけ受け取る。
  function requestApi(action, params = {}, timeout = 15000){
    return new Promise((resolve,reject)=>{
      const nonce = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.setAttribute('aria-hidden','true');
      let finished = false;

      const timer = setTimeout(()=>{
        cleanup();
        reject(new Error('通信タイムアウト'));
      }, timeout);

      function cleanup(){
        if(finished)return;
        finished = true;
        clearTimeout(timer);
        window.removeEventListener('message', onMessage);
        if(iframe.parentNode)iframe.parentNode.removeChild(iframe);
      }

      function onMessage(event){
        let message = event.data;
        if(typeof message === 'string'){
          try{ message = JSON.parse(message); }
          catch(e){ return; }
        }
        if(!message || message.source !== 'yamanan-gacha-bridge' || message.nonce !== nonce)return;
        cleanup();
        resolve(message.payload);
      }

      window.addEventListener('message', onMessage);

      let url = GACHA_API_URL +
        '?action=' + encodeURIComponent(action) +
        '&bridge=1' +
        '&nonce=' + encodeURIComponent(nonce) +
        '&_=' + Date.now();

      Object.keys(params).forEach(key=>{
        url += '&' + encodeURIComponent(key) + '=' + encodeURIComponent(params[key]);
      });

      iframe.src = url;
      document.body.appendChild(iframe);
    });
  }

  // 引換は待たせない。GAS側が冪等なので2回送っても二重処理にならない。
  function sendRedeem(drawId){
    const send = () => {
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.setAttribute('aria-hidden','true');
      iframe.src = GACHA_API_URL +
        '?action=redeem' +
        '&bridge=1' +
        '&nonce=' + encodeURIComponent('redeem_' + Date.now() + '_' + Math.random().toString(36).slice(2)) +
        '&drawId=' + encodeURIComponent(drawId) +
        '&_=' + Date.now();
      document.body.appendChild(iframe);
      setTimeout(()=>{
        if(iframe.parentNode)iframe.parentNode.removeChild(iframe);
      },60000);
    };

    send();
    setTimeout(send,2500);
  }

  async function initLine(){
    if(typeof liff === 'undefined')throw new Error('LINEを読み込めませんでした。');
    await liff.init({liffId: LIFF_ID});
    if(!liff.isLoggedIn()){
      liff.login({redirectUri: location.href});
      return false;
    }

    const profile = await liff.getProfile();
    const userId = String(profile && profile.userId || '').trim();
    if(!/^U[0-9A-Za-z_-]{20,80}$/.test(userId)){
      throw new Error('LINEユーザーを確認できませんでした。');
    }
    lineUserId = userId;
    return true;
  }

  function showPrizeResult(data,alreadyDrawn=false){
    if(!data || !data.result || !data.drawId){
      throw new Error('当選結果を確認できませんでした。');
    }

    currentDrawId = String(data.drawId);
    const prizeId = String(data.result);
    prizeImage.src = prizeId + '.png?v=' + ASSET_VER;

    setToast(alreadyDrawn ? 'このLINEアカウントは抽選済みです。' : '');

    if(data.redeemed === true || data.redeemStatus === '引換済み'){
      redeemButton.style.display = 'none';
      redeemed.style.display = 'flex';
    }else{
      redeemed.style.display = 'none';
      redeemButton.style.display = 'block';
      redeemButton.disabled = false;
      redeemButton.textContent = '景品交換する';
    }

    showOnly(resultScreen);
  }

  function prepareMovie(){
    movieEnded = false;
    pendingResult = null;
    showOnly(videoScreen);
    videoTap.style.display = 'none';

    try{
      movie.pause();
      movie.currentTime = 0;
    }catch(e){}

    movie.onended = async () => {
      movieEnded = true;
      if(pendingResult){
        showPrizeResult(pendingResult,false);
        return;
      }

      try{
        if(drawRequestPromise)await drawRequestPromise;
        if(pendingResult){
          showPrizeResult(pendingResult,false);
          return;
        }
      }catch(e){}

      // 動画終了までに結果が来ない場合だけTOPへ戻す
      showOnly(startScreen);
      drawButton.disabled = false;
      drawButton.textContent = 'ガチャをひく';
      setStartMessage('抽選結果を確認できませんでした。もう一度押してください。',true);
      drawBusy = false;
    };

    movie.onerror = movie.onended;

    // ボタンタップ直後なのでiPhoneでも再生しやすい
    const p = movie.play();
    if(p && typeof p.catch === 'function'){
      p.catch(()=>{
        videoTap.style.display = 'flex';
      });
    }
  }

  videoTapButton.addEventListener('click',()=>{
    videoTap.style.display = 'none';
    const p = movie.play();
    if(p && typeof p.catch === 'function'){
      p.catch(()=>{ videoTap.style.display = 'flex'; });
    }
  });

  drawButton.addEventListener('click',()=>{
    if(drawBusy || !lineUserId)return;

    drawBusy = true;
    drawButton.disabled = true;
    setStartMessage('');

    // 先に動画を始める。待ち画面を作らない。
    prepareMovie();

    drawRequestPromise = (async()=>{
      let firstFailed = false;
      let data = null;

      try{
        data = await requestApi('draw',{userId: lineUserId},15000);
      }catch(e){
        firstFailed = true;
        // 1回目がGASでは成功して返答だけ落ちた場合に備え、同じuserIdで1回だけ確認。
        data = await requestApi('draw',{userId: lineUserId},15000);
      }

      if(!data || data.success !== true){
        throw new Error(data && data.message ? data.message : '抽選できませんでした。');
      }

      // 直接「抽選済み」が返った場合は過去抽選なので動画を止めて即表示。
      // ただし1回目の返答が落ちた後の再確認なら、今回の抽選結果として動画を続ける。
      if(data.alreadyDrawn === true && !firstFailed){
        try{ movie.pause(); }catch(e){}
        showPrizeResult(data,true);
        drawBusy = false;
        return data;
      }

      pendingResult = data;

      // 結果画像を動画中に先読み
      const preloadImage = new Image();
      preloadImage.src = String(data.result) + '.png?v=' + ASSET_VER;

      if(movieEnded){
        showPrizeResult(data,false);
      }

      drawBusy = false;
      return data;
    })().catch(error=>{
      console.error(error);
      if(movieEnded){
        showOnly(startScreen);
        drawButton.disabled = false;
        drawButton.textContent = 'ガチャをひく';
        setStartMessage(error && error.message ? error.message : '抽選できませんでした。',true);
        drawBusy = false;
      }
      throw error;
    });
  });

  redeemButton.addEventListener('click',()=>{
    if(!currentDrawId)return;

    const confirmed = window.confirm(
      'スタッフの方が操作してください。\n\n景品をお客様へお渡しした後に「OK」を押してください。'
    );
    if(!confirmed)return;

    // UIは即完了。処理中で待たせない。
    redeemButton.style.display = 'none';
    redeemed.style.display = 'flex';
    setToast('');

    // ログ更新は裏で送信。GAS側で重複は無害。
    sendRedeem(currentDrawId);
  });

  async function initializePage(){
    drawButton.disabled = true;
    drawButton.textContent = 'LINE認証を確認しています…';
    setStartMessage('');

    // 動画は先に読み込み開始
    movie.src = 'y.mp4?v=' + ASSET_VER;
    try{ movie.load(); }catch(e){}

    try{
      const ok = await initLine();
      if(!ok)return;
      drawButton.disabled = false;
      drawButton.textContent = 'ガチャをひく';
    }catch(error){
      console.error(error);
      drawButton.disabled = true;
      drawButton.textContent = 'LINE認証エラー';
      setStartMessage(
        (error && error.message ? error.message : 'LINE認証に失敗しました。') +
        ' LINEからもう一度開いてください。',
        true
      );
    }
  }

  initializePage();
</script>
</body>
</html>
