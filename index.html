<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>山南自動車 大抽選会</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #fff;
      color: #222;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }


    /* ========================================
       共通
    ======================================== */

    .screen {
      display: none;

      width: 100%;
      min-height: 100dvh;
    }

    .screen.active {
      display: flex;
    }


    /* ========================================
       最初の画面
    ======================================== */

    #startScreen {
      align-items: center;
      justify-content: center;

      padding: 24px;

      background: #fff;
    }

    .start-box {
      width: 100%;
      max-width: 720px;

      margin: 0 auto;

      text-align: center;
    }

    .start-subtitle {
      margin-bottom: 10px;

      font-size: 20px;
      font-weight: 800;
      line-height: 1.5;
    }

    .start-title {
      margin-bottom: 45px;

      font-size: 40px;
      font-weight: 900;
      line-height: 1.25;
    }

    .draw-button {
      display: block;

      width: 100%;
      max-width: 500px;
      min-height: 90px;

      margin: 0 auto;

      border: 0;
      border-radius: 18px;

      background: #111;
      color: #fff;

      font-size: 28px;
      font-weight: 900;

      cursor: pointer;

      box-shadow: 0 8px 0 #555;
    }

    .draw-button:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #555;
    }

    .draw-button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .loading {
      display: none;

      margin-top: 24px;

      font-size: 18px;
      font-weight: 800;
    }

    .error-message {
      display: none;

      margin-top: 24px;
      padding: 16px;

      border-radius: 12px;

      background: #f1f1f1;

      font-size: 16px;
      font-weight: 800;
      line-height: 1.6;
    }


    /* ========================================
       動画
       y.mp4 = 720 × 1080
    ======================================== */

    #videoScreen {
      align-items: flex-start;
      justify-content: center;

      padding: 0;

      background: #000;
    }

    .video-wrap {
      position: relative;

      width: 100%;
      max-width: 720px;

      margin: 0 auto;

      background: #000;
    }

    #gachaVideo {
      display: block;

      width: 100%;
      height: auto;

      margin: 0;

      background: #000;
    }

    .video-status {
      display: none;

      position: absolute;

      left: 50%;
      bottom: 5%;

      transform: translateX(-50%);

      width: 76%;
      max-width: 540px;

      padding: 14px 18px;

      border-radius: 14px;

      background: rgba(0, 0, 0, 0.72);
      color: #fff;

      font-size: 18px;
      font-weight: 900;

      text-align: center;

      z-index: 3;
    }


    /* ========================================
       当選結果
       y1.png ～ y7.png = 720 × 1080
    ======================================== */

    #resultScreen {
      align-items: flex-start;
      justify-content: center;

      padding: 0;

      background: #fff;
    }

    .prize-wrap {
      position: relative;

      width: 100%;
      max-width: 720px;

      margin: 0 auto;
    }

    .prize-image {
      display: block;

      width: 100%;
      height: auto;

      margin: 0;
      padding: 0;

      border: 0;
    }


    /* ========================================
       景品交換ボタン
       720×1080画像の中に重ねる
    ======================================== */

    .redeem-button,
    .redeemed-message {
      position: absolute;

      left: 50%;
      bottom: 4.4%;

      transform: translateX(-50%);

      width: 76%;
      max-width: 540px;
      min-height: 82px;

      border-radius: 18px;

      z-index: 5;
    }

    .redeem-button {
      display: block;

      border: 0;

      background: rgba(17, 17, 17, 0.90);
      color: #fff;

      font-size: 24px;
      font-weight: 900;

      cursor: pointer;
    }

    .redeem-button:active {
      transform:
        translateX(-50%)
        scale(0.985);
    }

    .redeem-button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .redeemed-message {
      display: none;

      align-items: center;
      justify-content: center;

      padding: 18px;

      background: rgba(229, 229, 229, 0.96);
      color: #666;

      font-size: 28px;
      font-weight: 900;

      text-align: center;
    }


    @media (max-width: 480px) {

      .start-title {
        font-size: 38px;
      }

      .draw-button {
        min-height: 82px;
        font-size: 25px;
      }

      .redeem-button,
      .redeemed-message {
        min-height: 68px;
      }

      .redeem-button {
        font-size: 21px;
      }

      .redeemed-message {
        font-size: 24px;
      }
    }

  </style>
</head>


<body>


  <!-- ========================================
       最初の画面
  ======================================== -->

  <section
    id="startScreen"
    class="screen active"
  >

    <div class="start-box">

      <div class="start-subtitle">
        山南自動車公式LINE<br>
        お友達追加
      </div>

      <div class="start-title">
        大抽選会
      </div>

      <button
        id="drawButton"
        class="draw-button"
        type="button"
      >
        ガチャをひく
      </button>

      <div
        id="loading"
        class="loading"
      >
        抽選中です…
      </div>

      <div
        id="errorMessage"
        class="error-message"
      ></div>

    </div>

  </section>



  <!-- ========================================
       動画
  ======================================== -->

  <section
    id="videoScreen"
    class="screen"
  >

    <div class="video-wrap">

      <video
        id="gachaVideo"
        playsinline
        preload="metadata"
      >

        <source
          src="y.mp4"
          type="video/mp4"
        >

      </video>

      <div
        id="videoStatus"
        class="video-status"
      >
        抽選結果を確認中です…
      </div>

    </div>

  </section>



  <!-- ========================================
       当選結果
  ======================================== -->

  <section
    id="resultScreen"
    class="screen"
  >

    <div class="prize-wrap">

      <img
        id="prizeImage"
        class="prize-image"
        src=""
        alt="当選景品"
      >

      <button
        id="redeemButton"
        class="redeem-button"
        type="button"
      >
        景品交換する
      </button>

      <div
        id="redeemedMessage"
        class="redeemed-message"
      >
        引換済み
      </div>

    </div>

  </section>



  <script>

    // ==================================================
    // GAS WebアプリURL
    // ==================================================

    const API_URL =
      'https://script.google.com/macros/s/AKfycbxE4H0xTiuuM4tgMAH32exXPDMnq3mZDA8sEYNeZ2lpvglsyGevvzxMEBr9d9LdOkhm/exec';


    // ==================================================
    // LIFF ID
    // ==================================================

    const LIFF_ID =
      '2011684043-GnjrPlL2';


    // ==================================================
    // HTML
    // ==================================================

    const startScreen =
      document.getElementById(
        'startScreen'
      );

    const videoScreen =
      document.getElementById(
        'videoScreen'
      );

    const resultScreen =
      document.getElementById(
        'resultScreen'
      );

    const drawButton =
      document.getElementById(
        'drawButton'
      );

    const loading =
      document.getElementById(
        'loading'
      );

    const errorMessage =
      document.getElementById(
        'errorMessage'
      );

    const gachaVideo =
      document.getElementById(
        'gachaVideo'
      );

    const videoStatus =
      document.getElementById(
        'videoStatus'
      );

    const prizeImage =
      document.getElementById(
        'prizeImage'
      );

    const redeemButton =
      document.getElementById(
        'redeemButton'
      );

    const redeemedMessage =
      document.getElementById(
        'redeemedMessage'
      );


    // ==================================================
    // 状態
    // ==================================================

    let currentDrawId =
      '';

    let currentPrize =
      null;

    let currentDemoMode =
      false;

    let redeeming =
      false;

    let liffInitialized =
      false;

    let cachedUserId =
      '';

    let lineUserPromise =
      null;

    let videoFinished =
      false;


    // ==================================================
    // 画面切替
    // ==================================================

    function showScreen(
      screen
    ) {

      startScreen
        .classList
        .remove(
          'active'
        );

      videoScreen
        .classList
        .remove(
          'active'
        );

      resultScreen
        .classList
        .remove(
          'active'
        );


      screen
        .classList
        .add(
          'active'
        );


      window.scrollTo(
        0,
        0
      );
    }


    // ==================================================
    // GAS GET
    // ==================================================

    async function apiGet(
      params
    ) {

      const url =
        new URL(
          API_URL
        );


      Object.keys(
        params
      ).forEach(
        key => {

          url
            .searchParams
            .set(
              key,
              params[key]
            );
        }
      );


      const response =
        await fetch(
          url.toString(),
          {
            cache:
              'no-store'
          }
        );


      return await response.json();
    }


    // ==================================================
    // GAS POST
    // ==================================================

    async function apiPost(
      data
    ) {

      const response =
        await fetch(
          API_URL,
          {
            method:
              'POST',

            keepalive:
              true,

            body:
              JSON.stringify(
                data
              )
          }
        );


      const text =
        await response.text();


      try {

        return JSON.parse(
          text
        );


      } catch (error) {

        throw new Error(
          'サーバーから正常な応答を取得できませんでした。'
        );
      }
    }


    // ==================================================
    // LINE userId
    // ==================================================

    async function getLineUserId() {

      if (
        !LIFF_ID
      ) {

        throw new Error(
          'LINE連携が設定されていません。'
        );
      }


      if (
        !liffInitialized
      ) {

        await liff.init({
          liffId:
            LIFF_ID
        });


        liffInitialized =
          true;
      }


      if (
        !liff.isLoggedIn()
      ) {

        liff.login();

        return '';
      }


      const profile =
        await liff.getProfile();


      if (
        !profile ||
        !profile.userId
      ) {

        throw new Error(
          'LINE認証を確認できませんでした。'
        );
      }


      return String(
        profile.userId
      );
    }


    // ==================================================
    // LINE認証を先に準備
    // ==================================================

    async function prepareLineUserId() {

      if (
        cachedUserId
      ) {

        return cachedUserId;
      }


      if (
        !lineUserPromise
      ) {

        lineUserPromise =
          getLineUserId()
            .then(
              userId => {

                if (
                  userId
                ) {

                  cachedUserId =
                    userId;
                }


                return userId;
              }
            )
            .catch(
              error => {

                lineUserPromise =
                  null;

                throw error;
              }
            );
      }


      return await lineUserPromise;
    }


    // ==================================================
    // エラー
    // ==================================================

    function showError(
      message
    ) {

      loading.style.display =
        'none';

      drawButton.disabled =
        false;

      drawButton.textContent =
        'ガチャをひく';

      errorMessage.textContent =
        message;

      errorMessage.style.display =
        'block';
    }


    // ==================================================
    // 動画
    // ==================================================

    async function playGachaVideo() {

      loading.style.display =
        'none';

      videoStatus.style.display =
        'none';


      showScreen(
        videoScreen
      );


      gachaVideo.currentTime =
        0;

      gachaVideo.controls =
        false;


      try {

        gachaVideo.muted =
          false;

        await gachaVideo.play();


      } catch (error) {

        try {

          gachaVideo.muted =
            true;

          await gachaVideo.play();


        } catch (error2) {

          gachaVideo.controls =
            true;
        }
      }
    }


    gachaVideo
      .addEventListener(
        'ended',
        function () {

          videoFinished =
            true;


          if (
            currentPrize
          ) {

            showPrizeResult(
              currentPrize
            );


          } else {

            videoStatus.style.display =
              'block';
          }
        }
      );


    // ==================================================
    // 結果画面の下余白を
    // 当選画像下端の色で埋める
    // ==================================================

    function setResultBackgroundFromImage() {

      try {

        if (
          !prizeImage.complete ||
          !prizeImage.naturalWidth ||
          !prizeImage.naturalHeight
        ) {

          return;
        }


        const canvas =
          document.createElement(
            'canvas'
          );


        canvas.width =
          32;

        canvas.height =
          1;


        const ctx =
          canvas.getContext(
            '2d',
            {
              willReadFrequently:
                true
            }
          );


        const sampleHeight =
          Math.max(
            10,
            Math.floor(
              prizeImage.naturalHeight *
              0.03
            )
          );


        ctx.drawImage(

          prizeImage,

          0,

          prizeImage.naturalHeight -
            sampleHeight,

          prizeImage.naturalWidth,

          sampleHeight,

          0,

          0,

          32,

          1
        );


        const pixels =
          ctx
            .getImageData(
              0,
              0,
              32,
              1
            )
            .data;


        let r =
          0;

        let g =
          0;

        let b =
          0;


        for (
          let i = 0;
          i < pixels.length;
          i += 4
        ) {

          r +=
            pixels[i];

          g +=
            pixels[i + 1];

          b +=
            pixels[i + 2];
        }


        const count =
          pixels.length /
          4;


        const color =
          'rgb(' +

          Math.round(
            r /
            count
          ) +

          ',' +

          Math.round(
            g /
            count
          ) +

          ',' +

          Math.round(
            b /
            count
          ) +

          ')';


        resultScreen
          .style
          .background =
            color;

        document
          .body
          .style
          .background =
            color;

        document
          .documentElement
          .style
          .background =
            color;


      } catch (error) {

        console.error(
          '背景色設定エラー',
          error
        );
      }
    }


    prizeImage
      .addEventListener(
        'load',
        setResultBackgroundFromImage
      );


    // ==================================================
    // 景品表示
    // ==================================================

    function showPrizeResult(
      data
    ) {

      if (
        !data
      ) {

        return;
      }


      // 景品ID y1 ～ y7
      // ↓
      // y1.png ～ y7.png

      prizeImage.src =
        data.prizeId +
        '.png';


      videoStatus.style.display =
        'none';


      showScreen(
        resultScreen
      );


      const localRedeemedId =
        localStorage.getItem(
          'yamanan_local_redeemed'
        );


      if (
        data.redeemStatus ===
          '引換済み' ||

        localRedeemedId ===
          currentDrawId
      ) {

        showRedeemed();


        // 端末側では引換済みだが
        // GAS側がまだなら裏で再送

        if (
          localRedeemedId ===
            currentDrawId &&

          data.redeemStatus !==
            '引換済み'
        ) {

          syncRedeemInBackground(
            currentDrawId,
            0
          );
        }


      } else {

        redeemButton.style.display =
          'block';

        redeemButton.disabled =
          false;

        redeemButton.textContent =
          '景品交換する';

        redeemedMessage.style.display =
          'none';
      }
    }


    // ==================================================
    // ガチャをひく
    // ==================================================

    drawButton
      .addEventListener(
        'click',
        async function () {


          const savedDrawId =
            localStorage.getItem(
              'yamanan_draw_id'
            );


          // --------------------------------------
          // 同じ端末で抽選済み
          // 再抽選POSTはしない
          // --------------------------------------

          if (
            savedDrawId
          ) {

            currentDrawId =
              savedDrawId;

            drawButton.disabled =
              true;

            errorMessage.style.display =
              'none';


            if (
              currentPrize
            ) {

              showPrizeResult(
                currentPrize
              );

              return;
            }


            await restoreResult();

            return;
          }


          drawButton.disabled =
            true;

          loading.style.display =
            'none';

          errorMessage.style.display =
            'none';


          try {

            const userId =
              await prepareLineUserId();


            if (
              !userId
            ) {

              drawButton.disabled =
                false;

              return;
            }


            currentPrize =
              null;

            videoFinished =
              false;


            // --------------------------------------
            // ボタンを押したら先に動画開始
            // GAS抽選は裏で同時進行
            // --------------------------------------

            playGachaVideo();


            const result =
              await apiPost({

                action:
                  'draw',

                userId:
                  userId

              });


            if (
              !result.ok
            ) {

              gachaVideo.pause();


              showScreen(
                startScreen
              );


              showError(
                result.message ||
                result.error ||
                '抽選できませんでした。'
              );


              return;
            }


            currentDrawId =
              result.drawId;

            currentPrize =
              result;

            currentDemoMode =
              result.testMode ===
              true;


            localStorage.setItem(
              'yamanan_draw_id',
              currentDrawId
            );


            localStorage.setItem(
              'yamanan_demo_mode',

              currentDemoMode
                ? 'true'
                : 'false'
            );


            videoStatus.style.display =
              'none';


            // 動画の方が先に終わった場合

            if (
              videoFinished
            ) {

              showPrizeResult(
                currentPrize
              );
            }


          } catch (error) {

            console.error(
              error
            );


            gachaVideo.pause();


            showScreen(
              startScreen
            );


            showError(
              error.message ||
              '通信エラーが発生しました。'
            );
          }
        }
      );


    // ==================================================
    // 引換GASバックグラウンド同期
    //
    // 画面は待たせない
    // 最大5回まで自動再送
    // ==================================================

    async function syncRedeemInBackground(
      drawId,
      attempt = 0
    ) {

      if (
        !drawId
      ) {

        return;
      }


      try {

        const result =
          await apiPost({

            action:
              'redeem',

            drawId:
              drawId

          });


        if (
          result &&
          result.ok
        ) {

          localStorage.removeItem(
            'yamanan_redeem_pending'
          );


          return;
        }


      } catch (error) {

        console.error(
          '引換同期エラー',
          error
        );
      }


      if (
        attempt <
        4
      ) {

        const delays =
          [
            1500,
            3000,
            6000,
            12000,
            20000
          ];


        setTimeout(

          function () {

            syncRedeemInBackground(

              drawId,

              attempt +
              1
            );

          },

          delays[
            Math.min(
              attempt,
              delays.length - 1
            )
          ]
        );
      }
    }


    // ==================================================
    // 景品交換
    //
    // OKを押した瞬間
    // ↓
    // 即「引換済み」
    //
    // GASの返事は待たない
    // ==================================================

    redeemButton
      .addEventListener(
        'click',
        function () {


          if (
            redeeming ||
            !currentDrawId
          ) {

            return;
          }


          const confirmed =
            window.confirm(

              'スタッフの方が操作していますか？\n\n景品をお客様へお渡しした後に「OK」を押してください。'

            );


          if (
            !confirmed
          ) {

            return;
          }


          redeeming =
            true;


          // --------------------------------------
          // 端末側に即保存
          // --------------------------------------

          localStorage.setItem(

            'yamanan_local_redeemed',

            currentDrawId

          );


          localStorage.setItem(

            'yamanan_redeem_pending',

            currentDrawId

          );


          // --------------------------------------
          // 画面は即「引換済み」
          // --------------------------------------

          showRedeemed();


          // --------------------------------------
          // GASへの保存は裏で実行
          // --------------------------------------

          syncRedeemInBackground(

            currentDrawId,

            0

          );
        }
      );


    // ==================================================
    // 引換済み表示
    // ==================================================

    function showRedeemed() {

      redeemButton.style.display =
        'none';


      redeemedMessage.style.display =
        'flex';


      redeeming =
        false;
    }


    // ==================================================
    // 当選結果復旧
    // ==================================================

    async function restoreResult() {

      const savedDrawId =
        localStorage.getItem(
          'yamanan_draw_id'
        );


      if (
        !savedDrawId
      ) {

        return;
      }


      currentDrawId =
        savedDrawId;


      try {

        const result =
          await apiGet({

            action:
              'result',

            drawId:
              savedDrawId

          });


        // --------------------------------------
        // GAS側でリセットされた場合
        // 端末側もリセット
        // --------------------------------------

        if (
          !result.ok
        ) {

          localStorage.removeItem(
            'yamanan_draw_id'
          );

          localStorage.removeItem(
            'yamanan_demo_mode'
          );

          localStorage.removeItem(
            'yamanan_local_redeemed'
          );

          localStorage.removeItem(
            'yamanan_redeem_pending'
          );


          currentDrawId =
            '';

          currentPrize =
            null;


          drawButton.disabled =
            false;

          drawButton.textContent =
            'ガチャをひく';

          loading.style.display =
            'none';


          prepareLineUserId()
            .catch(
              error =>
                console.error(
                  'LINE事前認証エラー',
                  error
                )
            );


          return;
        }


        currentPrize =
          result;

        currentDemoMode =
          result.testMode ===
          true;


        localStorage.setItem(

          'yamanan_demo_mode',

          currentDemoMode
            ? 'true'
            : 'false'

        );


        // GAS側でも引換済みなら
        // 未同期フラグ解除

        if (
          result.redeemStatus ===
          '引換済み'
        ) {

          localStorage.setItem(

            'yamanan_local_redeemed',

            savedDrawId

          );


          localStorage.removeItem(
            'yamanan_redeem_pending'
          );
        }


        showPrizeResult(
          result
        );


      } catch (error) {

        console.error(
          '結果復旧エラー',
          error
        );


        // 通信エラーの場合は
        // 二重抽選防止のため
        // 抽選IDは消さない

        drawButton.disabled =
          true;
      }
    }


    // ==================================================
    // 起動
    // ==================================================

    async function startApp() {

      // --------------------------------------
      // 前回の引換保存が
      // GAS側へ届いていなければ自動再送
      // --------------------------------------

      const pendingRedeemId =
        localStorage.getItem(
          'yamanan_redeem_pending'
        );


      if (
        pendingRedeemId
      ) {

        syncRedeemInBackground(

          pendingRedeemId,

          0

        );
      }


      const savedDrawId =
        localStorage.getItem(
          'yamanan_draw_id'
        );


      if (
        savedDrawId
      ) {

        drawButton.disabled =
          true;

        loading.style.display =
          'none';


        await restoreResult();


      } else {

        // --------------------------------------
        // ガチャを押す前に
        // LIFF認証を準備
        // --------------------------------------

        prepareLineUserId()
          .catch(
            error =>
              console.error(
                'LINE事前認証エラー',
                error
              )
          );
      }
    }


    // ==================================================
    // iPhone等で閉じる直前にも
    // 未同期の引換を再送
    // ==================================================

    window.addEventListener(
      'pagehide',
      function () {


        const pendingRedeemId =
          localStorage.getItem(
            'yamanan_redeem_pending'
          );


        if (
          !pendingRedeemId
        ) {

          return;
        }


        fetch(
          API_URL,
          {

            method:
              'POST',

            keepalive:
              true,

            body:
              JSON.stringify({

                action:
                  'redeem',

                drawId:
                  pendingRedeemId

              })
          }
        )
        .catch(
          () => {}
        );
      }
    );


    // ==================================================
    // START
    // ==================================================

    startApp();

  </script>

</body>
</html>
